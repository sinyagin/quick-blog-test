# Generated by DevDigest. Re-exporting from the studio regenerates this file.
name: DevDigest Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Fork PRs never receive secrets; skip them rather than fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Run DevDigest review
        run: node .devdigest/runner/index.js
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEVDIGEST_PR_NUMBER: ${{ github.event.pull_request.number }}
          DEVDIGEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEVDIGEST_WORKFLOW_RUN_ID: ${{ github.run_id }}
          DEVDIGEST_AGENT: "general-reviewer"
          DEVDIGEST_POST_AS: pr_comment
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devdigest-result
          path: devdigest-result.json
          if-no-files-found: ignore
